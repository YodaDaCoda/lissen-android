name: Upstream Sync

# Rebases the slice patches on main onto upstream main, then emits a dev release.
# See .agents/README.md ("Repository philosophy"). A rebase conflict fails the run: fix the slice by hand.

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: upstream-sync

jobs:
  sync:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase slices onto upstream
        id: rebase
        run: |
          git config user.name "upstream-sync"
          git config user.email "upstream-sync@users.noreply.github.com"
          git remote add upstream https://github.com/GrakovNe/lissen-android.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git rebase upstream/main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        if: steps.rebase.outputs.changed == 'true'
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Build dev APK
        if: steps.rebase.outputs.changed == 'true'
        run: ./gradlew assembleDev -Pminified=true -PsingleAbi=true

      # push only after the rebased tree builds, so main is never left broken
      - name: Push rebased main
        if: steps.rebase.outputs.changed == 'true'
        run: git push --force-with-lease origin HEAD:main

      - name: Publish dev release
        if: steps.rebase.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="dev-$(date +'%Y%m%d')-$(git rev-parse --short HEAD)"
          gh release create "$tag" app/build/outputs/apk/dev/app-dev.apk \
            --prerelease --title "Dev $tag" \
            --notes "Auto-rebased onto upstream $(git rev-parse --short upstream/main)"
